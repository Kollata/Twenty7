  bahamut:       {<<: *acl, url: "https://testingcf.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Providers/Ruleset/Bahamut.yaml"}
  bilibili_hmt:  {<<: *acl, url: "https://testingcf.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Providers/Ruleset/BilibiliHMT.yaml"}
  bilibili:      {<<: *acl, url: "https://testingcf.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Providers/Ruleset/Bilibili.yaml"}
  # Loyalsoldier（文件后缀是 .txt，内容是 yaml 格式）
  reject:         {<<: *loyal, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"}
  applications:   {<<: *loyal, behavior: classical, url: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"}

# ---------- 路由规则（自上而下，先匹配先生效） ----------
rules:
  # 1. 局域网
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  # 自定义规则写在这里（优先级高于下面的规则集），例如：
  # - DOMAIN-SUFFIX,example.com,DIRECT
  # - DOMAIN-SUFFIX,huggingface.co,🤖 AI服务
  # 需要让 DNS 泄露检测域名走代理时，取消下面两行注释（只影响 https://ip.skk.moe/dns-exit-lookup 检测结果）
  - DOMAIN-SUFFIX,nstool.netease.com,🚀 默认代理
  - DOMAIN-SUFFIX,dns-detect.alicdn.com,🚀 默认代理
  # 2. 需要直连的软件（下载工具等）
  - RULE-SET,applications,DIRECT
  # 3. 广告
  - RULE-SET,reject,🛑 广告拦截
  # 4. 服务分流（范围小的在前）
  - RULE-SET,ai,🤖 AI服务
  - RULE-SET,youtube,📹 YouTube
  - RULE-SET,fcm,📢 谷歌FCM,no-resolve
  - RULE-SET,google,🍀 Google
  - RULE-SET,github,🐙 GitHub
  - RULE-SET,telegram,📲 Telegram
  - RULE-SET,tiktok,🎵 TikTok
  - RULE-SET,bahamut,📺 巴哈姆特,no-resolve
  - RULE-SET,bilibili_hmt,📺 哔哩哔哩,no-resolve
  - RULE-SET,bilibili,📺 哔哩哔哩,no-resolve
  - RULE-SET,netflix,🎥 流媒体
  - RULE-SET,disney,🎥 流媒体
  - RULE-SET,hbo,🎥 流媒体
  - RULE-SET,paypal,💶 PayPal
  - RULE-SET,bing,Ⓜ️ 微软Bing,no-resolve
  - RULE-SET,onedrive,Ⓜ️ 微软云盘,no-resolve
  - RULE-SET,microsoft,🪟 微软服务,no-resolve
  - RULE-SET,apple,🍎 苹果服务,no-resolve
  - RULE-SET,steam_cn,DIRECT
  - RULE-SET,games_cn,DIRECT
  - RULE-SET,epic,🎮 游戏平台,no-resolve
  - RULE-SET,origin,🎮 游戏平台,no-resolve
  - RULE-SET,sony,🎮 游戏平台,no-resolve
  - RULE-SET,steam,🎮 游戏平台,no-resolve
  - RULE-SET,nintendo,🎮 游戏平台,no-resolve
  - RULE-SET,netease_music,🎶 网易音乐,no-resolve
  # 5. 境外 / 国内域名
  - RULE-SET,not_cn,🚀 默认代理
  - RULE-SET,cn_domain,DIRECT
  # 6. 纯 IP 连接（no-resolve：不为匹配它们而解析域名）
  - RULE-SET,telegram_ip,📲 Telegram,no-resolve
  - RULE-SET,netflix_ip,🎥 流媒体,no-resolve
  - RULE-SET,google_ip,🍀 Google,no-resolve
  # 7. 兜底：no-resolve 表示匹配规则时不为域名做本地解析；
  #    未被域名规则收录的国内网站会走「漏网之鱼」
  - RULE-SET,cn_ip,DIRECT,no-resolve
  - MATCH,🐟 漏网之鱼

# 本配置只用 RULE-SET，不需要 GEO 数据库。
# 若自行添加 GEOSITE / GEOIP 规则，可取消注释（geodata-mode 为 true 时 geoip 用 .dat）：
# geodata-mode: true
# geox-url:
#   geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
#   geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
#   mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
#   asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"